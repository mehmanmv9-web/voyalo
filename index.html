<style>

let RU_VOICE=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices().filter(v=>/^ru/i.test(v.lang));
 const fem=/milena|alena|katya|katerina|svetlana|irina|anna|elena|dariya|daria|ekaterina|female|жен/i, male=/yuri|pavel|dmitr|maxim|male|муж/i;
 RU_VOICE=vs.find(v=>fem.test(v.name))||vs.find(v=>/google/i.test(v.name))||vs.find(v=>!male.test(v.name))||vs[0]||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}

let AC=null;function beep(f=660,d=.12,type='sine',v=.15){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);const t=AC.currentTime;g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d)}catch(e){}}
function yay(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.18,'triangle'),i*110))}
function sayKid(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';pickVoice();if(RU_VOICE)u.voice=RU_VOICE;u.rate=.95;u.pitch=1.15;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function confetti(){const box=document.createElement('div');box.className='confetti';box.innerHTML=Array.from({length:28},()=>`<i style="left:${Math.random()*100}%;animation-delay:${Math.random()*.6}s;font-size:${18+Math.random()*18}px">${['🎉','⭐','🌴','🐘','🎈','🌸'][Math.floor(Math.random()*6)]}</i>`).join('');document.getElementById('app').appendChild(box);setTimeout(()=>box.remove(),2600)}

 const I=T.ints||[],kids=T.people.some(p=>p.age!=='a');const used=new Set();
 const score=(x,pref)=>{let s=x.s||0;if(pref.includes(x.k))s+=6;if(I.includes('beach')&&x.k==='beach')s+=3;if(I.includes('culture')&&(x.k==='museum'||x.k==='wiki'||x.k==='sight'))s+=3;if(kids&&x.k==='kids')s+=4;if(I.includes('shop')&&(x.k==='mall'||x.k==='market'))s+=3;if(I.includes('nature')&&(x.k==='park'||x.k==='view'||x.k==='beach'))s+=3;if(I.includes('night')&&x.k==='show')s+=2;s-=x.m/4000;return s};

const LIBS={pdf:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',zip:'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',ocr:'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'};
const loadLib=(k)=>new Promise((ok,no)=>{if(loadLib[k])return ok();const s=document.createElement('script');s.src=LIBS[k];s.onload=()=>{loadLib[k]=1;ok()};s.onerror=no;document.head.appendChild(s)});
async function pdfText(buf){await loadLib('pdf');pdfjsLib.GlobalWorkerOptions.workerSrc=LIBS.pdf.replace('pdf.min.js','pdf.worker.min.js');const doc=await pdfjsLib.getDocument({data:buf}).promise;let out='';for(let i=1;i<=Math.min(doc.numPages,15);i++){const pg=await doc.getPage(i);const tc2=await pg.getTextContent();const rows={};tc2.items.forEach(it=>{const y=Math.round(it.transform[5]/3);(rows[y]=rows[y]||[]).push([it.transform[4],it.str])});out+=Object.keys(rows).sort((a,b)=>b-a).map(y=>rows[y].sort((a,b)=>a[0]-b[0]).map(x=>x[1]).join(' ')).join('\n')+'\n'}return out}
async function imgText(file){await loadLib('ocr');const r=await Tesseract.recognize(file,'eng+rus');return r.data.text}
async function fileText(f,name){name=name||f.name||'';const ext=name.toLowerCase().split('.').pop();
 if(ext==='pdf')return pdfText(await f.arrayBuffer());
 if(['png','jpg','jpeg','webp','heic','bmp'].includes(ext))return imgText(f);
 if(ext==='zip'){await loadLib('zip');const z=await JSZip.loadAsync(await f.arrayBuffer());let t='';for(const [n,e] of Object.entries(z.files)){if(e.dir)continue;const b=await e.async('blob');t+='\n'+await fileText(b,n).catch(()=>'')}return t}
 if(ext==='docx'){await loadLib('zip');const z=await JSZip.loadAsync(await f.arrayBuffer());const x=await z.file('word/document.xml').async('string');return x.replace(/<\/w:p>/g,'\n').replace(/<[^>]+>/g,' ')}
 const t=await f.text();return /<html/i.test(t)?t.replace(/<br\s*\/?>/gi,'\n').replace(/<\/(p|div|tr)>/gi,'\n').replace(/<[^>]+>/g,' '):t}
const dmy=s=>{let m=s.match(/(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})/);if(m)return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;m=s.match(/(\d{4})-(\d{2})-(\d{2})/);return m?m[0]:null};
function parseDocs(txt){const L=txt.split(/\n/).map(s=>s.replace(/\s+/g,' ').trim()).filter(Boolean);const R={fl:[],people:[],codes:[]};
 const DT=/(\d{1,2}[.\/]\d{1,2}[.\/]\d{4}|\d{4}-\d{2}-\d{2})/;
 L.forEach((l,i)=>{const d=l.match(DT);const f=l.match(/\b([A-Z]{2,3}|[A-Z]\d|\d[A-Z])\s?(\d{2,4})\b/);const t=l.match(/\b(\d{1,2}:\d{2})\b.*?\b(\d{1,2}:\d{2})\b/);
  if(d&&f&&t&&!/KG|PC/.test(f[1])){const near=L.slice(Math.max(0,i-2),i+3).join(' ');const cs=[...near.matchAll(/\(([A-Z]{3})\)|\b([A-Z]{3})\b(?=\s*$|\s*[-–])/g)].map(x=>x[1]||x[2]).filter(c=>IATA[c]);R.fl.push({no:f[1]+' '+f[2],date:dmy(d[0]),t1:t[1].padStart(5,'0'),t2:t[2].padStart(5,'0'),codes:cs})}
  const p=l.match(/\b([A-Z][A-Z'-]{1,})\s+([A-Z][A-Z'-]{1,})\s+(MR|MRS|MS|MISS|MSTR|CHD|INF)\b/);if(p&&!R.people.some(x=>x.n===p[2]&&x.s===p[1])){const db=l.slice(p.index+p[0].length).match(/(\d{2})[.\/](\d{2})[.\/](\d{4})/);R.people.push({s:p[1],n:p[2],t:p[3],by:db?+db[3]:null,bm:db?+db[2]:null})}
  const h=l.match(/(?:Hotel Name|Hotel|Отель|Гостиница|Accommodation)\s*[:\/]?\s*(?:\/\s*Отель:?)?\s*(.{3,80})/i);if(h&&!R.hotel){let n=h[1].replace(/^\d\s*\*+\s*/,'').replace(/\*+/g,'').replace(/^[:\s]+/,'').trim();const ar=n.match(/\(([^)]+)\)/);if(ar){R.area=ar[1];n=n.replace(ar[0],'').trim()}if(n.length>2&&!/voucher|ваучер|name/i.test(n))R.hotel=n}
  const pr=l.match(/(\d{2}[.\/]\d{2}[.\/]\d{4})\s*[-–—]{1,4}\s*(\d{2}[.\/]\d{2}[.\/]\d{4})/);if(pr&&!R.from){R.from=dmy(pr[1]);R.to=dmy(pr[2])}
  const ci=l.match(/(?:check[- ]?in|заезд)\D{0,15}(\d{1,2}[.\/]\d{1,2}[.\/]\d{4})/i);if(ci&&!R.from)R.from=dmy(ci[1]);const co=l.match(/(?:check[- ]?out|выезд)\D{0,15}(\d{1,2}[.\/]\d{1,2}[.\/]\d{4})/i);if(co&&!R.to)R.to=dmy(co[1]);
  if(/partner|принимающая|hotline|горячая линия|emergency|экстренн/i.test(l)&&!R.op){const ph=l.match(/\+?\d[\d\s()-]{7,}\d/);if(ph)R.op={name:(l.match(/[:\/]\s*([A-Za-zА-Яа-я][\w .&-]{2,40}?)\s+\+/)||[])[1]||'Туроператор',tel:ph[0].replace(/\s+/g,' ').trim(),wa:/whatsapp/i.test(l+' '+(L[i+1]||''))}}
  const ml=l.match(/\b(AI|UAI|ALL INCLUSIVE|BB|HB|FB|RO)\b/);if(/meal|питани/i.test(l+(L[i-1]||''))&&ml&&!R.meal)R.meal=ml[1];
  if(/transfer|трансфер/i.test(l)&&/group|групп|individual|индивид/i.test(l))R.transfer=/individual|индивид/i.test(l)?'индивидуальный':'групповой';
  [...l.matchAll(/\(([A-Z]{3})\)/g)].forEach(x=>IATA[x[1]]&&R.codes.push(x[1]))});
 const seen=new Set();R.fl=R.fl.filter(f=>{const k=f.no+f.date;if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>a.date.localeCompare(b.date));
 return R}
const MEALS={AI:'всё включено',UAI:'ультра всё включено','ALL INCLUSIVE':'всё включено',BB:'завтраки',HB:'завтрак и ужин',FB:'трёхразовое',RO:'без питания'};
/* IndexedDB для документов (только в телефоне) */
const IDB=()=>new Promise((ok,no)=>{const r=indexedDB.open('voyalo',1);r.onupgradeneeded=()=>r.result.createObjectStore('docs',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=no});
async function docPut(trip,file){const db=await IDB();return new Promise(ok=>{const tx=db.transaction('docs','readwrite');tx.objectStore('docs').put({id:trip+'|'+file.name+'|'+file.size,trip,name:file.name,type:file.type,blob:file,t:Date.now()});tx.oncomplete=ok})}
async function docList(trip){const db=await IDB();return new Promise(ok=>{const r=db.transaction('docs').objectStore('docs').getAll();r.onsuccess=()=>ok(r.result.filter(d=>d.trip===trip))})}
async function docDel(id){const db=await IDB();return new Promise(ok=>{const tx=db.transaction('docs','readwrite');tx.objectStore('docs').delete(id);tx.oncomplete=ok})}

async function handleFiles(files){if(!files.length)return;UPFILES=files;const box=$('#upres');box.innerHTML=`<div class="li"><div class="spin"></div><p style="text-align:center">Читаем ${files.length} ${plural(files.length,'файл','файла','файлов')}…${files.some(f=>/image/.test(f.type))?' Фото распознаются до минуты.':''}</p></div>`;

async function fromDocs(R){const b=$('#upgo');b.disabled=true;b.textContent='⏳ Находим город и отель…';newWiz();show('wiz');
 const out=R.fl[0],back=R.fl.length>1?R.fl[R.fl.length-1]:null;const arrCode=out&&out.codes[1],depCode=out&&out.codes[0];
 const destName=(arrCode&&IATA[arrCode])||(R.area?R.area.split(/[ ,]/)[0]:'');
 try{if(destName){const g=await geo(destName);if(g[0])W.dest=await fixTz(g[0])}}catch(e){}

 if(back)W.back={no:back.no,dep:back.date+'T'+back.t1,arr:(back.t2<back.t1?addD(back.date,1):back.date)+'T'+back.t2};
 if(R.people.length){const yr=+(W.from||'2026').slice(0,4);W.people=R.people.map(p=>{const age=p.by?yr-p.by:null;const cat=p.t==='INF'||age!==null&&age<3?'0':p.t==='CHD'||age!==null&&age<18?(age===null?'6':age<6?'3':age<10?'6':age<14?'10':'14'):'a';const nm=p.n.charAt(0)+p.n.slice(1).toLowerCase();return{n:nm,age:cat,e:cat==='a'?(/MRS|MS|MISS/.test(p.t)?'👩':'👨'):cat==='0'?'👶':'🧒'}});const fam=(R.people.find(p=>p.t==='MR')||R.people[0]).s;W.title='Семья '+fam.charAt(0)+fam.slice(1).toLowerCase()}
 if(R.hotel&&W.dest){try{const d=W.dest,vb=`${d.lng-.8},${d.lat+.8},${d.lng+.8},${d.lat-.8}`;let r=await J(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=3&accept-language=ru&viewbox=${vb}&bounded=1&q=${encodeURIComponent(R.hotel)}`);if(!r.length&&R.area)r=await J(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=3&accept-language=ru&q=${encodeURIComponent(R.hotel+' '+R.area)}`);if(r[0])W.hotel={name:R.hotel,addr:r[0].display_name,lat:+r[0].lat,lng:+r[0].lon};else W.hotel={name:R.hotel,addr:R.area||'',lat:d.lat,lng:d.lng,approx:true}}catch(e){}}

const enc=new TextEncoder(),dec=new TextDecoder();
const b64u=a=>btoa(String.fromCharCode(...new Uint8Array(a))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const ub64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
let RK=null,RTOP='',RSSE=null;
async function room(){if(!T.room){T.room=b64u(crypto.getRandomValues(new Uint8Array(16)));const i=TRIPS.findIndex(t=>t.id===T.id);TRIPS[i]=T;saveTrips()}
 if(RK&&RK.id===T.room)return;const h=await crypto.subtle.digest('SHA-256',enc.encode('voyalo:'+T.room));RTOP='voy'+b64u(h).replace(/[-_]/g,'').slice(0,22);RK={id:T.room,k:await crypto.subtle.importKey('raw',h,'AES-GCM',false,['encrypt','decrypt'])}}
async function seal(o){const iv=crypto.getRandomValues(new Uint8Array(12));const c=await crypto.subtle.encrypt({name:'AES-GCM',iv},RK.k,enc.encode(JSON.stringify(o)));return b64u(iv)+'.'+b64u(c)}
async function open_(s){const[a,b]=s.split('.');return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(a)},RK.k,ub64(b))))}
const MSGS=()=>LS.get('m_'+T.id,[]);const setMSGS=m=>LS.set('m_'+T.id,m.slice(-600));

 try{await fetch('https://ntfy.sh/'+RTOP,{method:'POST',body:await seal(m)});if(o.k==='t'||o.k==='poll'||o.k==='sos')fetch('https://ntfy.sh/',{method:'POST',body:JSON.stringify({topic:RTOP+'n',title:'Voyalo · '+m.n,message:o.k==='poll'?'🗳️ '+o.q:o.k==='sos'?'🆘 SOS! Нужна помощь':String(o.t).slice(0,120),priority:o.k==='sos'?5:3,click:location.origin+location.pathname})}).catch(()=>{})}catch(e){toast('Нет интернета — отправим позже');m.pend=1;setMSGS(MSGS().map(x=>x.id===m.id?m:x))}}
async function sync(){if(!T)return;await room();const L=MSGS();const ids=new Set(L.map(x=>x.id));const since=LS.get('since_'+T.id,'12h');
 try{const r=await fetch(`https://ntfy.sh/${RTOP}/json?poll=1&since=${since}`);const tx=await r.text();let last=since;for(const line of tx.split('\n')){if(!line.trim())continue;const ev=JSON.parse(line);if(ev.event!=='message')continue;last=ev.id;try{const m=await open_(ev.message);if(!ids.has(m.id)){L.push(m);ids.add(m.id)}}catch(e){}}L.sort((a,b)=>a.ts-b.ts);setMSGS(L);LS.set('since_'+T.id,last)}catch(e){}
 for(const m of MSGS().filter(x=>x.pend&&x.uid===(me()||{}).uid)){try{delete m.pend;await fetch('https://ntfy.sh/'+RTOP,{method:'POST',body:await seal(m)});setMSGS(MSGS().map(x=>x.id===m.id?m:x))}catch(e){break}}onMsg()}
function live(){room().then(()=>{if(RSSE)RSSE.close();try{RSSE=new EventSource(`https://ntfy.sh/${RTOP}/sse`);RSSE.onmessage=async ev=>{try{const d=JSON.parse(ev.data);const m=await open_(d.message);const L=MSGS();if(!L.some(x=>x.id===m.id)){L.push(m);setMSGS(L);if(m.uid!==(me()||{}).uid&&m.k==='t')toast(m.e+' '+m.n+': '+String(m.t).slice(0,40));if(m.k==='sos'&&m.uid!==(me()||{}).uid)showFull(`<div style="font-size:64px">🆘</div><div class="big">${esc(m.n)} просит помощи!</div>${m.lat?`<a class="act pri" style="margin-top:16px" href="${gdir(m.lat,m.lng)}" target="_blank">🧭 Маршрут к ${esc(m.n)}</a>`:''}`);onMsg()}}catch(e){}}}catch(e){}})}

VIEWS.tours=function(){const c=T.dest.name,en=encodeURIComponent,sea=!!tc().marine,kids=T.people.some(p=>p.age!=='a');
 const TY=[['🗺️','Обзорная экскурсия по городу','city tour'],sea&&['🚤','Морская прогулка и острова','boat trip islands'],kids&&['🧸','С детьми: зоопарк, аквапарк, океанариум','family kids'],['🍜','Гастротур — местная кухня','food tour'],['🏛️','Музеи и билеты без очереди','tickets museum'],['🌅','Закат и вечерние прогулки','sunset tour'],['🌿','Природа: водопады, горы, парки','nature day trip'],['🎭','Шоу и развлечения','show tickets']].filter(Boolean);
 page('🚤 Туры и экскурсии',`<div class="li"><b>💡 Как не переплатить</b><p>Сравните цену на 2–3 сайтах и у уличных агентств. Спросите: входит ли трансфер от вашего отеля, детская цена, бесплатная отмена при плохой погоде.</p></div>${TY.map(([e,t,q])=>`<div class="li"><b>${e} ${t}</b><div class="tc-l"><a class="act" href="https://www.klook.com/search/result/?query=${en(c+' '+q)}" target="_blank">Klook</a><a class="act" href="https://www.getyourguide.com/s/?q=${en(c+' '+q)}" target="_blank">GetYourGuide</a><a class="act" href="https://www.viator.com/searchResults/all?text=${en(c+' '+q)}" target="_blank">Viator</a><a class="act" href="https://www.tripadvisor.com/Search?q=${en(c+' '+q)}" target="_blank">Tripadvisor</a></div></div>`).join('')}
 <div class="li"><b>🇷🇺 На русском языке</b><div class="tc-l"><a class="act" href="https://www.google.com/search?q=${en('экскурсии '+c+' на русском sputnik8 OR tripster')}" target="_blank">Спутник8 / Трипстер</a><a class="act" href="https://www.google.com/search?q=${en('экскурсии '+c+' отзывы цены')}" target="_blank">Отзывы и цены</a></div></div>`)};
/* ---------- PDF для печати ---------- */
VIEWS.print=function(){const P=tc().pool?buildPlan():[];const h=T.hotel||{};const w=window.open('','_blank');if(!w)return toast('Разрешите всплывающие окна');
 w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Voyalo · ${esc(T.dest.name)}</title><style>body{font:14px/1.45 system-ui,sans-serif;margin:24px;color:#111}h1{margin:0 0 4px}h2{margin:18px 0 6px;font-size:17px;border-bottom:2px solid #7048e8}table{border-collapse:collapse;width:100%}td{padding:4px 6px;border-bottom:1px solid #ddd;vertical-align:top}.big{font-size:20px;font-weight:700}@media print{button{display:none}}</style></head><body>
 <button onclick="print()" style="padding:10px 16px;font-size:16px;margin-bottom:12px">🖨️ Печать / сохранить PDF</button><h1>${flagE(T.dest.cc)} ${esc(T.dest.name)}</h1><div>${fmtD(T.from)} — ${fmtD(T.to)} · ${esc(T.people.map(p=>p.n).join(', '))}</div>
 <h2>🏨 Отель — показать таксисту</h2><div class="big">${esc(h.name||'')}</div><div>${esc(h.addr||'')}</div>
 <h2>✈️ Рейсы</h2><table>${T.out.dep?`<tr><td>Туда</td><td>${esc(T.out.no)}</td><td>${T.out.dep.replace('T',' ')} → ${T.out.arr.replace('T',' ')}</td></tr>`:''}${T.back.dep?`<tr><td>Обратно</td><td>${esc(T.back.no)}</td><td>${T.back.dep.replace('T',' ')} → ${T.back.arr.replace('T',' ')}</td></tr>`:''}</table>
 <h2>🆘 Экстренные номера</h2><table>${emergList().map(([n,t])=>`<tr><td>${esc(n)}</td><td class="big">${t}</td></tr>`).join('')}${T.op?`<tr><td>${esc(T.op.name)}</td><td class="big">${esc(T.op.tel)}</td></tr>`:''}</table>
 ${P.length?`<h2>🗓️ Программа</h2><table>${P.map((d,i)=>`<tr><td><b>День ${i+1}</b><br>${fmtD(d.s)}</td><td>${d.sl.map(s=>`${s[0]} <b>${esc(s[1])}:</b> ${esc(s[2])}`).join('<br>')}</td></tr>`).join('')}</table>`:''}
 <h2>🗣️ Фразы</h2><table>${(PK()?PK().ph:GEN_PH).map(x=>`<tr><td>${esc(x[0])}</td><td class="big">${esc(x[1])}</td><td>${esc(x[2])}</td></tr>`).join('')}</table><p style="color:#888">Создано в Voyalo</p></body></html>`);w.document.close()};

/* ---------- старт ---------- */
document.addEventListener('click',e=>{if(e.target.closest('[data-sossend]')){if(!me())return pickMe(()=>VIEWS.sos());const go=(p)=>send({k:'sos',lat:p?+p.coords.latitude.toFixed(5):null,lng:p?+p.coords.longitude.toFixed(5):null}).then(()=>toast('🆘 SOS отправлен семье'));navigator.geolocation?navigator.geolocation.getCurrentPosition(go,()=>go(null),{timeout:10000}):go(null)}});
(function init(){gte();const m=location.hash.match(/#trip=([\w-]+)/);if(m){try{const t=b64d(m[1]);const i=TRIPS.findIndex(x=>x.id===t.id);if(i>=0)TRIPS[i]={...t,cache:TRIPS[i].cache};else TRIPS.push(t);CUR=t.id;saveTrips();history.replaceState(null,'',location.pathname);toast('Путеводитель добавлен в «Мои поездки»')}catch(e){}}
 if(!LS.get('lang',null)&&!m){renderLang(true);return}
 if(curTrip())openGuide();else{renderLand();show('land')}
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})})();

</script></body></html>
